# Polymarket Perps liquidity quoter. Copy to config/quoter.yaml (gitignored) and edit.
# Spec: ../perps-quoter-architecture.md. Reward rules: https://docs.polymarket.com/perps/liquidity-rewards

# Instruments to quote: symbols (PLTR-USD or PLTR) or instrument ids from /v1/info/instruments.
# Each one uses the defaults below (levels, inventory, leverage) unless it overrides them.
# The dashboard can add or remove instruments at runtime; that choice is saved to data/selection.json
# and restored at the next start (pass --from-config to use this list instead).
instruments:
  - PLTR-USD
  - NVDA-USD
  # - symbol: BTC-USD           # per-instrument override example
  #   levels:
  #     - {band: 1, bps: 3.0, size_usd: 2000}
  #     - {band: 2, bps: 8.0, size_usd: 1000}
  #   inventory: {max_position_usd: 10000}
  #   leverage: 3
mode: dry_run               # dry_run | live. Live also needs `run --live` on the command line.
leverage: 5                 # default; set via PATCH /v1/trade/leverage at live startup; null keeps the exchange setting

operator:
  # Where YOU physically operate the bot (ISO 3166-1 / 3166-2). Required for live mode.
  # Order placement is blocked from US, CA, CU, IR, KP, SY, Crimea, Donetsk, Luhansk.
  # The egress proxy country does not change this. Read-only market data is unrestricted.
  jurisdiction: ""          # e.g. UA
  region: ""                # e.g. UA-30 (required for UA)

egress:
  select: fastest           # fastest: probe all proxies at start and use the lowest-latency healthy one; ordered: keep list order
  allow_direct: false       # true adds a direct connection as the last resort
  timeout_ms: 8000
  public_feeds: 2           # redundant public market-data streams over distinct proxies (1–3)

credentials:
  proxy_ttl_hours: 168      # Polymarket proxy key lifetime (owner-key mode, max 7 days). Alert 24 h before expiry, halt 2 min before.

levels:                     # bps from mid; size_usd per side. Start small (spec §15 stage 6).
  - {band: 1, bps: 3.5, size_usd: 1000}
  - {band: 2, bps: 8.0, size_usd: 1000}
  - {band: 3, bps: 17.0, size_usd: 1000}

requote:
  threshold_bps: 0.5        # do not move an order for a smaller price change
  min_interval_ms: 250      # debounce between quote cycles
  refill_ratio: 0.5         # top up when less than 50% of the target quantity rests
  min_edge_bps: 1.0         # never quote closer to mid than this

inventory:
  max_position_usd: 5000
  skew_bps_per_10k: 0.5     # long $10k → bids 0.5 bps further, asks 0.5 bps closer (kept inside each band)
  stop_side_mode: zero      # zero | shrink (keep the growing side at min_notional)

risk:
  stale_book_ms: 2000
  vol_breaker: {move_bps: 15, window_s: 5, pause_s: 30, action: pause, widen_bps: 0}
  max_daily_loss_usd: 200   # since the 12:00 UTC reward-period start; halts until manual restart
  min_available_margin_usd: 500
  post_only_reject_widen: {after: 3, ticks: 1, for_s: 10}
  startup_cancel_all: true  # cancel pre-existing orders on this instrument at start; false refuses to start instead
  reconcile_every_s: 30     # periodic REST reconcile in addition to the private stream
  max_freeze_s: 15          # a freeze (state unverified) longer than this pulls all quotes

deadman:
  timeout_s: 60
  rearm_every_s: 20

sessions:                   # equities follow the NYSE weekly schedule (holidays not modeled)
  schedule: auto            # auto | regular
  regular:   {size_mult: 1.0, bps_add: 0}
  overnight: {size_mult: 0.5, bps_add: 1.5}
  weekend:   {size_mult: 0.3, bps_add: 3}

budget:
  action_share: 0.7         # use at most 70% of actions_per_minute_limit from /v1/account/limits

metrics:
  dir: data                 # JSONL metrics (gitignored)
  flush_s: 60

dashboard:                  # local panel at http://127.0.0.1:<port> (loopback only; Stop needs the per-process token)
  enabled: true
  port: 4320
